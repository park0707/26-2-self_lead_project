# vidio-health-trainer Render.com Free Tier Deployment Specification
# 100% Free Forever, No Credit Card Required, Automated GitHub CI/CD

services:
  - type: web
    name: vidio-health-trainer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.web.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PYTHONUNBUFFERED
        value: "1"
